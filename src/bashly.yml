name: kikoeru
help: An ASMR platform
version: 0.1.0

environment_variables:
  - name: alfred_debug
    help: This variable is only set if is debugging, and is set to value 1.
    private: true
  - name: alfred_workflow_cache
    help: Path to the alfred workflow cache directory, required for alfred output format.
    private: true
  - name: KIKOERU_API_URL
    required: true
    help: The kikoeru api endpoint, like https://api.example.com/api .

flags:
  - long: --format
    short: -f
    arg: name
    allowed: [alfred]
    help: Output format [alfred]
    required: true
  - long: --verbose
    short: -v
    help: Increase output verbosity (up to -vv)
    repeatable: true

dependencies:
  - curl
  - jq

commands:
  - name: login
    help: Login to the Kikoeru platform

    args:
      - name: name
        required: true
        help: Username to use for logging in
      - name: password
        required: true
        help: Password to use for logging in

    examples:
      - kikoeru login <username> <password>
