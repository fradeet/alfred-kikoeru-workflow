name: kikoeru
help: An ASMR platform
version: 0.1.0

environment_variables:
  - name: KIKOERU_API_URL
    required: true
    help: The kikoeru api endpoint, like https://api.example.com/api .
  - name: KIKOERU_CACHE_DIR
    required: true
    help: Path to the cache directory
  - name: KIKOERU_FRONTEND_URL
    required: true
    help: Path to the frontend URL
  - name: KIKOERU_PASSWORD
    required: true
    help: Password to use for logging in
  - name: KIKOERU_USERNAME
    required: true
    help: Username to use for logging in

flags:
  - long: --verbose
    short: -v
    help: Increase output verbosity (up to -v)
    repeatable: true

dependencies:
  - curl
  - jq
  - date

commands:
  - name: review
    help: Reviewed works on Kikoeru platform

  - flags:
      - long: --order
        arg: name
        help: Order by field
      - long: --output-format
        arg: name
        allowed:
          - alfred
        help: Output format
      - long: --page
        arg: number
        help: Page number
      - long: --sort
        arg: name
        allowed:
          - asc
          - desc
        help: Sort order

    examples:
      - kikoeru review
