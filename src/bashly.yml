name: kikoeru
help: An ASMR platform
version: 0.1.0

environment_variables:
  - name: KIKOERU_API_URL
    required: true
    help: The kikoeru api endpoint, like https://api.example.com/api .
  - name: KIKOERU_USERNAME
    required: true
    help: Username to use for logging in
  - name: KIKOERU_PASSWORD
    required: true
    help: Password to use for logging in
  - name: KIKOERU_CACHE_DIR
    required: true
    help: Path to the cache directory

flags:
  - long: --verbose
    short: -v
    help: Increase output verbosity (up to -v)
    repeatable: true
  - long: --output-format
    arg: name
    allowed:
      - alfred
    help: Output format

dependencies:
  - curl
  - jq
  - date

commands:
  - name: review
    help: Reviewed works on Kikoeru platform

    examples:
      - kikoeru review
