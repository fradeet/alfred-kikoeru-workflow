name: kikoeru-cli
help: An ASMR platform
version: 0.5.0

environment_variables:
  - name: KIKOERU_API_ENDPOINT
    required: true
    help: The kikoeru api endpoint, like http://127.0.0.1:8888/api .
  - name: KIKOERU_CLI_CACHE_DIR
    default: /tmp/kikoeru_cli
    help: Path to the cache directory
  - name: KIKOERU_FRONTEND_URL
    required: true
    help: Path to the frontend URL
  - name: KIKOERU_PASSWORD
    required: true
    help: Password to use for logging in
  - name: KIKOERU_USERNAME
    required: true
    help: Username to use for logging in

flags:
  - long: --verbose
    short: -v
    help: Increase output verbosity (up to -v)
    repeatable: true

dependencies:
  - curl
  - jq
  - date

commands:
  - name: review
    help: Reviewed works on Kikoeru platform

    flags:
      - long: --filter
        arg: status
        allowed: [marked, listening, listened, replay, postponed]
        help: Filter by listening status
      - long: --order
        arg: name
        allowed:
          [
            release,
            id,
            dl_count,
            price,
            review_count,
            rate_average_2dp,
            nsfw,
            updated_at,
          ]
        help: Order by field
      - long: --output-format
        arg: format
        allowed: [alfred]
        help: Output format
      - long: --page
        arg: number
        help: Page number
      - long: --sort
        arg: name
        allowed: [asc, desc]
        help: Sort order

    examples:
      - kikoeru review
