name: kikoeru
help: An ASMR platform
version: 0.1.0

environment_variables:
  - name: KIKOERU_API_URL
    required: true
    help: The kikoeru api endpoint, like https://api.example.com/api .

flags:
  - long: --output-format
    arg: name
    allowed: [alfred]
    help: Output format [alfred]
    required: true
  - long: --verbose
    short: -v
    help: Increase output verbosity (up to -v)
    repeatable: true
  - long: --cache-dir
    arg: path
    required: true
    help: Path to the cache directory

dependencies:
  - curl
  - jq

commands:
  - name: login
    help: Login to the Kikoeru platform

    args:
      - name: name
        required: true
        help: Username to use for logging in
      - name: password
        required: true
        help: Password to use for logging in

    examples:
      - kikoeru login <username> <password>
