name: kikoeru
help: An ASMR platform
version: 0.1.0

environment_variables:
  - name: alfred_debug
    help: This variable is only set if is debugging, and is set to value 1.
  - name: alfred_workflow_cache
  - name: alfred_workflow_data
  - name: alfred_workflow_description
    help: Description of the running workflow.
  - name: alfred_workflow_name
    help: Name of the running workflow.
  - name: KIKOERU_API_URL
    required: true
    help: The kikoeru api endpoint, like https://api.example.com/api .


flags:
  - long: --format
    short: -f
    arg: name
    allowed: [alfred]
    help: Output format
    required: true

dependencies:
  - curl
  - jq

commands:
  - name: login
    help: Login to the Kikoeru platform

    args:
      - name: name
        required: true
        help: Username to use for logging in
      - name: password
        required: true
        help: Password to use for logging in

    examples:
      - kikoeru login <username> <password>

    environment_variables:
      - name: default_target_location
        help: Set the default location to download to
